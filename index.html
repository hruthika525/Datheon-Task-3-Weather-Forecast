
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast - Weather Forecast</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">

        <header>
            <h1>☀ SkyCast</h1>
            <p>Real-Time Weather & Climate Dashboard</p>
        </header>

        <form id="search-form">
            <input
                type="text"
                id="city-input"
                placeholder="Enter city name..."
                autocomplete="off"
                required
            >
            <button type="submit" id="search-btn">Search</button>
        </form>

        <div id="loading" class="loading" hidden>
            <div class="spinner"></div>
            <p>Getting weather information...</p>
        </div>

        <div id="error-message" class="error-message" hidden></div>

        <main id="weather-content" hidden>

            <section class="current-weather">
                <div class="location">
                    <h2 id="city-name">City</h2>
                    <p id="date">Date</p>
                </div>

                <div class="weather-main">
                    <div>
                        <img id="weather-icon" src="" alt="Weather icon">
                        <h3 id="weather-condition">Sunny</h3>
                    </div>

                    <div class="temperature">
                        <span id="temperature">--</span>°C
                        <p id="feels-like">Feels like --°C</p>
                    </div>
                </div>
            </section>

            <section class="metrics">
                <div class="metric-card">
                    <span>💧</span>
                    <p>Humidity</p>
                    <h3 id="humidity">--%</h3>
                </div>

                <div class="metric-card">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <h3 id="wind">-- m/s</h3>
                </div>

                <div class="metric-card">
                    <span>🌡️</span>
                    <p>Pressure</p>
                    <h3 id="pressure">-- hPa</h3>
                </div>
            </section>

            <section class="forecast-section">
                <h2>5-Day Weather Forecast</h2>
                <div id="forecast-list" class="forecast-list"></div>
            </section>

        </main>

        <footer>
            <p>Weather data powered by OpenWeatherMap</p>
            <p>Created for Datheon Internship Task 3</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
